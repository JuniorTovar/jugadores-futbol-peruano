<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jugador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif']
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-semibold mb-6 text-center text-blue-600">Registro de Jugador</h1>
        <form id="registroForm" method="POST" action="/registrar-jugador" class="space-y-4">
            <div>
                <label for="nombre" class="block text-gray-700 text-sm font-bold mb-2">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese el nombre del jugador">
            </div>
            <div>
                <label for="edad" class="block text-gray-700 text-sm font-bold mb-2">Edad:</label>
                <input type="number" id="edad" name="edad" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese la edad del jugador">
            </div>
            <div>
                <label for="posicion" class="block text-gray-700 text-sm font-bold mb-2">Posición:</label>
                <input type="text" id="posicion" name="posicion" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese la posición del jugador">
            </div>
            <div>
                <label for="equipo" class="block text-gray-700 text-sm font-bold mb-2">Equipo Actual:</label>
                <select id="equipo" name="equipo" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    <option value="" disabled selected>Seleccione un equipo</option>
                </select>
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">Registrar Jugador</button>
        </form>
        <div id="mensaje" class="mt-4 text-center text-gray-600"></div>
    </div>
    <script>
        const equipos = ["Equipo A", "Equipo B", "Equipo C", "Equipo D"];

        window.onload = function() {
            const equipoSelect = document.getElementById("equipo");

            equipos.forEach(equipo => {
                let option = document.createElement("option");
                option.value = equipo;
                option.textContent = equipo;
                equipoSelect.appendChild(option);
            });

            const registroForm = document.getElementById("registroForm");
            registroForm.addEventListener("submit", function(event) {
                event.preventDefault();

                const nombre = document.getElementById("nombre").value;
                const edad = document.getElementById("edad").value;
                const posicion = document.getElementById("posicion").value;
                const equipo = document.getElementById("equipo").value;
                const mensaje = document.getElementById("mensaje");

                if (nombre.trim() === "") {
                    mensaje.textContent = "Por favor, ingrese el nombre del jugador.";
                    return;
                }
                if (edad === "" || isNaN(edad) || parseInt(edad) <= 0) {
                    mensaje.textContent = "Por favor, ingrese una edad válida.";
                    return;
                }
                if (posicion.trim() === "") {
                    mensaje.textContent = "Por favor, ingrese la posición del jugador.";
                    return;
                }
                if (equipo === "") {
                    mensaje.textContent = "Por favor, seleccione un equipo.";
                    return;
                }

                fetch("/registrar-jugador", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ nombre, edad, posicion, equipo })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        mensaje.textContent = "Jugador registrado exitosamente.";
                        registroForm.reset();
                    } else {
                        mensaje.textContent = "Error al registrar jugador: " + data.message;
                    }
                })
                .catch(error => {
                    mensaje.textContent = "Error al registrar jugador: " + error.message;
                });
            });
        };
    </script>
</body>
</html>
